#GitHub workflow - YAML GitHub workflow(github-workflow.json)
name: pipeline

on:
  push:
    branches:
        - main
      
jobs:
  run-python-code:
    runs-on: ubuntu-latest
  

    steps:
        - name: checkout code
          uses: actions/checkout@v7

        - name: python version
          run: python --version

        - name: set up python version
          uses: actions/setup-python
          with:
              python version: '13.3' 

        - name: run python program
          run: python welcome.py


